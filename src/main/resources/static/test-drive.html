<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMW Test Drive</title>

    <link rel="stylesheet" href="css/test-drive.css">
</head>

<body>

    <main class="test-drive-page">

        <!-- DARK BACKGROUND -->
        <div class="test-drive-background"></div>


        <!-- BMW LOGO TOP RIGHT -->
        <div class="bmw-logo">
            <img src="images/bmw-logo.jpg?v=2" alt="BMW Logo">
        </div>


        <!-- MAIN CONTENT -->
        <div class="test-drive-content">


            <!-- LEFT CONTENT -->
            <div class="test-drive-info">

                <p style="font-size: 11px; letter-spacing: 5px; color: #aaa;">
                    TEST DRIVE
                </p>

                <h1>
                    EXPERIENCE<br>
                    <span>THE THRILL</span><br>
                    IN REAL LIFE.
                </h1>

                <p>
                    Get behind the wheel and feel what makes
                    BMW exceptional.
                </p>


                <!-- MODEL SELECTION -->
                <div class="model-options">

                    <!-- BMW 2 SERIES -->
                    <button
                        type="button"
                        class="model-option active"
                        data-model="BMW 2 Series"
                        data-image="images/bmw2.jpg">

                        BMW 2 Series

                    </button>


                    <!-- BMW 3 SERIES -->
                    <button
                        type="button"
                        class="model-option"
                        data-model="BMW 3 Series"
                        data-image="images/bmw3.jpg">

                        BMW 3 Series

                    </button>


                    <!-- BMW 4 SERIES -->
                    <button
                        type="button"
                        class="model-option"
                        data-model="BMW 4 Series"
                        data-image="images/bmw4.jpg">

                        BMW 4 Series

                    </button>


                    <!-- BMW 5 SERIES -->
                    <button
                        type="button"
                        class="model-option"
                        data-model="BMW 5 Series"
                        data-image="images/bmw5.jpg">

                        BMW 5 Series

                    </button>


                    <!-- BMW 7 SERIES -->
                    <button
                        type="button"
                        class="model-option"
                        data-model="BMW 7 Series"
                        data-image="images/bmw7.jpg">

                        BMW 7 Series

                    </button>


                    <!-- BMW 8 SERIES -->
                    <button
                        type="button"
                        class="model-option"
                        data-model="BMW 8 Series"
                        data-image="images/bmw8.jpg">

                        BMW 8 Series

                    </button>

                </div>


                <!-- BOOK TEST DRIVE BUTTON -->
                <button
                    type="button"
                    class="book-drive-btn"
                    id="openBooking">

                    BOOK A TEST DRIVE

                </button>

            </div>


            <!-- FULL SCREEN CAR -->
            <div class="test-drive-car">

                <img
                    id="testDriveCarImage"
                    src="images/bmw2.jpg"
                    alt="BMW 2 Series">

            </div>


            <!-- BOOKING FORM -->
            <div class="booking-panel" id="bookingPanel">

                <!-- CLOSE BUTTON -->
                <button
                    type="button"
                    class="close-booking"
                    id="closeBooking">

                    &times;

                </button>


                <h2>Book a Test Drive</h2>


                <form id="testDriveForm">


                    <!-- MODEL -->
                    <label for="model">
                        Select BMW Model
                    </label>

                    <select id="model" required>

                        <option value="BMW 2 Series">
                            BMW 2 Series
                        </option>

                        <option value="BMW 3 Series">
                            BMW 3 Series
                        </option>

                        <option value="BMW 4 Series">
                            BMW 4 Series
                        </option>

                        <option value="BMW 5 Series">
                            BMW 5 Series
                        </option>

                        <option value="BMW 7 Series">
                            BMW 7 Series
                        </option>

                        <option value="BMW 8 Series">
                            BMW 8 Series
                        </option>

                    </select>


                    <!-- LOCATION -->
                    <label for="location">
                        Select Location
                    </label>

                    <select id="location" required>

                        <option value="Ahmedabad, Gujarat">
                            Ahmedabad, Gujarat
                        </option>

                        <option value="Surat, Gujarat">
                            Surat, Gujarat
                        </option>

                        <option value="Vadodara, Gujarat">
                            Vadodara, Gujarat
                        </option>

                    </select>


                    <!-- FIRST NAME -->
                    <label for="firstName">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter first name"
                        required>


                    <!-- LAST NAME -->
                    <label for="lastName">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter last name"
                        required>


                    <!-- EMAIL -->
                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>


                    <!-- MOBILE -->
                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        maxlength="10"
                        placeholder="Enter 10 digit mobile number"
                        required>


                    <!-- DATE -->
                    <label for="date">
                        Preferred Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required>


                    <!-- TIME -->
                    <label for="time">
                        Preferred Time
                    </label>

                    <select id="time" required>

                        <option value="">
                            Select time
                        </option>

                        <option value="10:00 AM">
                            10:00 AM
                        </option>

                        <option value="11:00 AM">
                            11:00 AM
                        </option>

                        <option value="12:00 PM">
                            12:00 PM
                        </option>

                        <option value="02:00 PM">
                            02:00 PM
                        </option>

                        <option value="03:00 PM">
                            03:00 PM
                        </option>

                        <option value="04:00 PM">
                            04:00 PM
                        </option>

                        <option value="05:00 PM">
                            05:00 PM
                        </option>

                    </select>


                    <!-- MESSAGE -->
                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        placeholder="Any specific query?"></textarea>


                    <!-- TERMS -->
                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            required>

                        I accept the Terms & Conditions

                    </label>


                    <br>


                    <!-- SUBMIT -->
                    <button
                        type="submit"
                        class="booking-submit">

                        BOOK TEST DRIVE

                    </button>

                </form>

            </div>

        </div>

    </main>


    <!-- JAVASCRIPT -->
    <script src="js/test-drive.js"></script>

</body>

</html>
